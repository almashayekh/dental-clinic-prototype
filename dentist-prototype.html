<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading Dentist Prototype...</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#111827;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;text-align:center;box-shadow:0 10px 28px rgba(15,23,42,.06)}.muted{color:#667085;font-size:13px;margin-top:8px}</style></head><body><div class="box"><strong>جاري تحميل Prototype الطبيب...</strong><div class="muted">لحظات قليلة</div></div><script>(async()=>{try{const files=['chunks/dentist-prototype-01.txt','chunks/dentist-prototype-02.txt','chunks/dentist-prototype-03.txt','chunks/dentist-prototype-04.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.text()}));document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<div class="box"><strong>تعذر تحميل البروتوتايب</strong><div class="muted">'+String(e)+'</div></div>'}})();</script></body></html>
